[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-tenant-api-gateway"
version = "1.0.0"
description = "A policy-enforcing, multi-tenant reverse proxy API gateway."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.8,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
api-gateway = "gateway.main:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["gateway*"]
